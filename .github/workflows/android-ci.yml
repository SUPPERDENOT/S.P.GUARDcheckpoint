name: Android CI

on:
  push:
    branches:
      - hardening/p0-recovery
      - feature/live-status-bar-p1
      - ui/industrial-instrument-antislop
      - fix/auto-start-coordinator-timing
      - integrate/p0-on-latest-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-audit:
    name: Anti-Slop UI Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run UI design and regression guards
        run: bash scripts/ui-audit.sh

  build-and-unit-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
